syntax = "proto3";
package client;

service Client {
  rpc GenerateMessages(GenerateMessagesRequest) returns (GenerateMessagesResponse) {}
  rpc AddMessages(stream AddMessagesRequest) returns (AddMessagesResponse) {}
}

message GenerateMessagesRequest {
  fixed64 round = 1;
}

message GenerateMessagesResponse {}

message AddMessagesRequest {
  fixed64 round = 1;
  repeated bytes messages = 2;
}

message AddMessagesResponse {

}