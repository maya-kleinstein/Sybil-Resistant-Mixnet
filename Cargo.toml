[package]
authors = ["The Hyperledger Ursa Contributors"]
description = "The BBS+ signature scheme"
documentation = "https://docs.rs/bbs"
edition = "2018"
license = "Apache-2.0"
name = "bbs"
readme = "README.md"
repository = "https://github.com/hyperledger/ursa"
version = "0.4.2"

[badges]
maintenance = { status = "actively-developed" }

[lib]
crate-type = ["cdylib", "rlib"]
path = "crypto/lib.rs"

[features]
default = ["rayon"]
wasm = ["serde-wasm-bindgen", "wasm-bindgen"]

[dependencies]
arrayref = "0.3"
blake2 = "0.8"
failure = "0.1"
ff-zeroize = "0.6"
hex = "0.4"
hkdf = "0.8"
rayon = { version = "1.3", optional = true }
rand = "0.7.3"
rand_4net = { package = "rand", version = "0.8.0" }
pairing-plus = { git = "https://github.com/kwantam/pairing-plus", branch = "endo" }
serde = { version = "1.0", features = ["serde_derive"] }
serde-wasm-bindgen = { version = "0.1", optional = true }
subtle = "2.2"
wasm-bindgen = { version = "0.2", optional = true }
zeroize = "1.1"
bincode = "1.3.3"
dryoc = {version = "0.4.0", features = ["serde"]}
lazy_static = "1.4.0"
tonic = "0.8.3"
prost = "0.11.6"

[dev-dependencies]
criterion = "0.4.0"

[[bench]]
name="network_benchmark"
harness=false

[profile.bench]
debug = true
