[package]
name = "bbs"
edition = "2018"
version = "0.4.2"

[badges]
maintenance = { status = "actively-developed" }

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["rayon"]
wasm = ["serde-wasm-bindgen", "wasm-bindgen"]

[dependencies]
arrayref = "0.3"
blake2 = "0.8"
failure = "0.1"
ff-zeroize = "0.6"
hex = "0.4"
hkdf = "0.8"
rayon = { version = "1.3", optional = true }
rand = "0.7.3"
rand_4net = { package = "rand", version = "0.8.0" }
pairing-plus = { git = "https://github.com/kwantam/pairing-plus", branch = "endo" }
serde = { version = "1.0", features = ["serde_derive"] }
serde-wasm-bindgen = { version = "0.1", optional = true }
subtle = "2.2"
wasm-bindgen = { version = "0.2", optional = true }
zeroize = "1.1"
bincode = "1.3.3"
dryoc = {version = "0.4.0", features = ["serde"]}
lazy_static = "1.4.0"
tonic = "0.8.3"
prost = "0.11.6"
tokio = { version = "1.19.2", features = ["macros", "rt-multi-thread", "full"] }
tokio-stream = "0.1.12"
local-ip-address = "0.5.1"
serde_json = "1.0.94"
futures = "0.3.28"
async-std = "1.12.0"
statrs = "0.16.0"
log = "0.4.20"
fern = "0.6.2"
chrono = "0.4.26"

[dev-dependencies]
criterion = {version = "0.5.1", features = ["async", "async_tokio"]}

[[bench]]
name="crypto_benchmark"
harness=false

[profile.bench]
debug = true

[build-dependencies]
tonic-build = "0.8.4"

[[bin]]
name = "mix"
path = "bins/mix/mix.rs"

[[bin]]
name = "config"
path = "bins/config/config.rs"

[[bin]]
name = "setup"
path = "bins/setup/setup.rs"
